name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Stable CocoaPods Environment
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Build iOS App with Unsigned Signing Allowed
        run: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install || pod install --repo-update
            cd ..
          fi
          flutter build ios --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" BUILD_DIR=build/ios_derived clean build

      - name: Bundle Payload into Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/Payload/ 2>/dev/null || cp -r build/ios/iphoneos/Runner.app build/Payload/ 2>/dev/null || true
          if [ -d build/Payload/Runner.app ]; then
            cd build
            zip -r -q PowerNews-release-unsigned.ipa Payload
            rm -rf Payload
          else
            echo "Notice: Runner.app not built in headless unsigned environment; skipping IPA packaging."
          fi

      - name: Upload IPA Artifact
        if: hashFiles('build/PowerNews-release-unsigned.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PowerNews-ios-ipa
          path: build/PowerNews-release-unsigned.ipa
          retention-days: 7
