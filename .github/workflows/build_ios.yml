name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Stable CocoaPods Environment
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Build iOS App (Unsigned)
        run: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install || pod install --repo-update
            cd ..
          fi
          flutter pub get
          flutter build ipa --no-codesign

      - name: Package Unsigned IPA from Archive if Needed
        run: |
          mkdir -p build/ios/ipa
          if [ ! -f build/ios/ipa/*.ipa ]; then
            if [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
              mkdir -p build/Payload
              cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/Payload/
              cd build
              zip -r -q ios/ipa/PowerNews-release-unsigned.ipa Payload
              rm -rf Payload
            elif [ -d build/ios/iphoneos/Runner.app ]; then
              mkdir -p build/Payload
              cp -r build/ios/iphoneos/Runner.app build/Payload/
              cd build
              zip -r -q ios/ipa/PowerNews-release-unsigned.ipa Payload
              rm -rf Payload
            fi
          fi

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PowerNews-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
