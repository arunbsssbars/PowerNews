name: DevSecOps & Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-audit:
    name: GitIgnore & Sensitive Files Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Sensitive Files Not Committed
        run: |
          echo "Auditing Git tracked files for sensitive patterns..."
          SUSPICIOUS=$(git ls-files | grep -E '(\.env$|\.env\.production$|key\.properties$|\.jks$|\.keystore$|serviceAccountKey\.json|client_secret.*\.json)' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "ERROR: Sensitive secrets found tracked in Git!"
            echo "$SUSPICIOUS"
            exit 1
          fi

          echo "Scanning tracked files for private cryptographic keys..."
          KEY_LEAKS=$(git grep -EI "BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY" || true)
          if [ -n "$KEY_LEAKS" ]; then
            echo "ERROR: Tracked private key material detected in repository!"
            echo "$KEY_LEAKS"
            exit 1
          fi

          echo "SUCCESS: Zero private keystores, client secrets, serviceAccountKeys, or private keys tracked in Git."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Node.js Server Dependencies
        run: |
          npm audit --audit-level=high || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Dependencies
        run: |
          flutter pub get
          flutter pub outdated --no-dev-dependencies
